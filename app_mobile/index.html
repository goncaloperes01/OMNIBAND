<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniBand Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome 6 (gratuito) para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
</head>
<body>

  <!-- ===== APPBAR ===== -->
  <header id="appbar">
    <div class="appbar-left">
      <i class="fas fa-robot"></i>
      <span class="appbar-title">OmniBand</span>
    </div>
    <div class="appbar-right">
      <span id="wearable-indicator" class="status-dot offline" title="Wearable offline"></span>
      <span id="battery-indicator" class="battery-badge">
        <i class="fas fa-bolt"></i> <span id="battery-value">--</span>%
      </span>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content">

    <!-- Tab: Divisões -->
    <section id="tab-rooms" class="tab-content active">
      <div class="room-banner" id="active-room-banner">
        <span id="active-room-label">Divisão ativa: <strong id="active-room-name">---</strong></span>
        <span id="active-room-time" class="time-ago"></span>
      </div>

      <div id="rooms-container" class="rooms-grid">
        <!-- Gerado por JS -->
      </div>
    </section>

    <!-- Tab: Wearable Status -->
    <section id="tab-status" class="tab-content">
      <h2 class="section-title"><i class="fas fa-broadcast-tower"></i> Estado do Wearable</h2>
      <div class="status-card" id="wearable-card">
        <!-- Gerado por JS -->
      </div>

      <h2 class="section-title"><i class="fas fa-history"></i> Últimos Comandos</h2>
      <div class="history-list" id="history-list">
        <!-- Gerado por JS -->
      </div>
    </section>

    <!-- Tab: Controlo Manual -->
    <section id="tab-control" class="tab-content">
      <h2 class="section-title"><i class="fas fa-sliders-h"></i> Painel de Controlo</h2>
      <div class="control-panel" id="control-panel">
        <!-- Gerado por JS -->
      </div>
    </section>

  </main>

  <!-- ===== BOTTOM NAVIGATION ===== -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="tab-rooms">
      <i class="fas fa-home"></i>
      <span>Divisões</span>
    </button>
    <button class="nav-btn" data-tab="tab-status">
      <i class="fas fa-microchip"></i>
      <span>Estado</span>
    </button>
    <button class="nav-btn" data-tab="tab-control">
      <i class="fas fa-gamepad"></i>
      <span>Controlo</span>
    </button>
  </nav>

  <!-- ===== TOAST NOTIFICATION ===== -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
